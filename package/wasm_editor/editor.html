<!DOCTYPE html>
<html lang="en-US">
<head>
    <title>ack-core editor</title>
    <meta charset="utf-8">
    <link rel="icon" href="data:;base64,=">
    <link rel="stylesheet" href="//cdn.webix.com/edge/skins/mini.css" type="text/css">
    <link rel="stylesheet" href="editor/styles.css">
    <script src="//cdn.webix.com/edge/webix.js" type="text/javascript"></script>
    <script src="editor/components.js" type="text/javascript"></script>
</head>
<body>
    <canvas class="rt" id="render_target"></canvas>
    <div class="editor" id="editor">
        <div class="top" id="top">
            <div class="editor_top_group" id="swd" hidden>
                <button class="editor_top_button" title="Set working directory" onclick="uiBindings.setWorkingDirectory()">&#x1F5C4;</button>
            </div>
            <div class="editor_top_group" id="top_buttons" hidden>
                <button class="editor_top_button" title="Load resources" onclick="uiBindings.loadResources()">&#x1F4E4;</button>
                <button class="editor_top_button" title="Center on selected object" onclick="uiBindings.centerOnObject()">&#x2316;</button>
                <button class="editor_top_button" title="Hide/show axis" onclick="uiBindings.axisSwitch(this)"><img src="editor/axis.svg"></button>
                <button class="editor_top_button" title="Update every frame" onclick="uiBindings.updateSwitch(this)">&#x25B6;</button>
            </div>
            <div class="editor_top_spacer"></div>
            <div class="editor_top_group" id="edit_resource_buttons" hidden>
                <button class="editor_top_button" title="Save resource &amp; Exit" onclick="uiBindings.resourceSaveAndExit()">&#x1F4BE;</button>
                <button class="editor_top_button" title="Discard changes in the resource &amp; Exit" onclick="uiBindings.resourceDiscardAndExit()">&#x1F6AB;</button>
            </div>
        </div>
        <div class="nodes" id="nodes">
            <div class="editor_nodes_buttons">
                <button class="editor_top_button" title="New node" onclick="uiBindings.treeNewNode(this)">&#x2795;</button>
                <button class="editor_top_button" title="Delete node" onclick="uiBindings.treeDeleteNode()">&#x274C;</button>
                <button class="editor_top_button" title="Save prefab" onclick="uiBindings.prefabSave()">&#x1F4BE;</button>
            </div>
            <div class="editor_nodes_tree" id="node_tree" onclick="if (event.target == this) uiBindings.spaceClick(event)"></div>
            <div class="editor_nodes_menu" id="add_node_menu" hidden></div>
        </div>
        <div class="inspect" id="inspect">
            <div class="editor_inspect_section" id="node_0" hidden>
                <div class="editor_inspect_header" onclick="uiBindings.inspectToggle(this)">Parameters</div>
                <div class="editor_inspect_body editor_inspect_form">
                    <div class="editor_inspect_row">
                        <label>Name:</label>
                        <input type="text" id="inspect_node_name" onchange="uiBindings.nodeName(this)">
                    </div>
                    <div class="editor_inspect_row">
                        <label>Position:</label>
                        <input type="number" id="inspect_node_x" step="0.1" min="-9999" max="9999" onchange="uiBindings.nodeMove()">
                        <input type="number" id="inspect_node_y" step="0.1" min="-9999" max="9999" onchange="uiBindings.nodeMove()">
                        <input type="number" id="inspect_node_z" step="0.1" min="-9999" max="9999" onchange="uiBindings.nodeMove()">
                    </div>
                </div>
            </div>
            <div class="editor_inspect_section" id="node_1_resource_list" hidden>
                <div class="editor_inspect_header" onclick="uiBindings.inspectToggle(this)">Resource List</div>
                <div class="editor_inspect_body editor_inspect_form">
                    <div class="editor_inspect_row">
                        <select id="node_resource_list" size="20" onchange="uiEditor.sendMsg('editor.setPath', this.value)"></select>
                        <div class="editor_nodes_buttons">
                            <button class="editor_top_button" title="Edit resource" onclick="uiBindings.nodeStartEdit()">&#x1F6E0;</button>
                            <button class="editor_top_button" title="Clone resource" onclick="uiBindings.cloneResource()">&#x2FFB;</button>
                            <button class="editor_top_button" title="Delete resource" onclick="uiBindings.deleteResource()">&#x274C;</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" charset="utf-8">
        var editorRootDirectory = null;
    </script>    
    <script type="text/javascript" src="wasm.js" binary="editor.wasm"></script>
    <script type="text/javascript" charset="utf-8">
        // 
        // TODO: center on object button -> node inspect, edit/save/cancel -> node inspect
        //

        ["nodes", "inspect", "top"].forEach(name => {
            document.getElementById(name).addEventListener("pointerdown", (event) => {
                event.stopPropagation();
                return false;
            });
            document.getElementById(name).addEventListener("keydown", (event) => {
                if (event.key != "Enter") {
                    event.stopPropagation();
                }
                return false;
            });
            document.getElementById(name).addEventListener("keyup", (event) => {
                if (event.key != "Enter") {
                    event.stopPropagation();
                }
                return false;
            });
            document.getElementById(name).addEventListener("wheel", (event) => {
                event.stopPropagation();
                return false;
            });
        })

        let uiInspectMappingBasic = ["node_0", "node_1_resource_list"];
        var uiInspectMappingEdit = {
            "null" : []
        };
        var resourcesExtMapping = {
            "null" : []
        };
        var texturesRoot = null;
        var uiNodeTree = null;
        var uiNodeName = null;
        var uiNodeTree = null;
        var uiInspectType = null;
        var uiResourceList = null;
        var listResources = {
            "null" : []
        };
        var listResFunctions = [];
        var dirBinaryData = null;
        var dirResources = null;

        let utility = {
            openDB: function() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('fs-db');
                    request.onupgradeneeded = () => {
                        const db = request.result;
                        if (!db.objectStoreNames.contains('handles')) {
                            db.createObjectStore('handles');
                        }
                    };
                    request.onsuccess = () => {
                        const db = request.result;
                        resolve({
                            get(storeName, key) {
                                return new Promise((resolve, reject) => {
                                    const tx = db.transaction(storeName, 'readonly');
                                    const store = tx.objectStore(storeName);
                                    const req = store.get(key);

                                    req.onsuccess = () => resolve(req.result);
                                    req.onerror = () => reject(req.error);
                                });
                            },
                            put(storeName, value, key) {
                                return new Promise((resolve, reject) => {
                                    const tx = db.transaction(storeName, 'readwrite');
                                    const store = tx.objectStore(storeName);
                                    const req = store.put(value, key);

                                    req.onsuccess = () => resolve();
                                    req.onerror = () => reject(req.error);
                                });
                            }
                        });
                    };
                    request.onerror = () => reject(request.error);
                });
            },
            parseConfig: function(text) {
                convertValue = (type, raw) => {
                    raw = raw.trim();
                    if (type == "bool") return raw == "true";
                    if (type == "string") return raw.replace(/"(.*)"/, "$1");
                    if (type == "integer") return parseInt(raw, 10);
                    if (type && /^vector\d+f$/i.test(type)) return raw.split(/\s+/).map(Number);
                    if (type == "number") return parseFloat(raw);
                    return null;
                }
                parseBlock = (body) => {
                    const obj = {};
                    const blockRe = /(\w+)\s*\{([^{}]*\{[^}]*\}[^{}]*|[^{}]*)\}/gs;
                    let match;
                    while ((match = blockRe.exec(body)) != null) {
                        const [, name, inner] = match;
                        obj[name] = parseBlock(inner);
                        body = body.replace(match[0], "");
                    }

                    const lineRe = /(\w+)\s*:\s*(\w+)?\s*=?\s*([^\n{}]+)/g;
                    while ((match = lineRe.exec(body)) != null) {
                        const [, key, type, raw] = match;
                        obj[key] = convertValue(type, raw);
                    }

                    return obj;
                }
                return parseBlock(text);
            },
            getPathDirectoryAndName: async function(dirHandle, relPath) {
                const pathParts = relPath.split('/');
                var handle = dirHandle;
                for (let i = 0; i < pathParts.length; i++) {
                    if (i == pathParts.length - 1) {
                        return [handle, pathParts[i]];
                    }
                    else {
                        handle = await handle.getDirectoryHandle(pathParts[i], { create: true });
                    }
                }
            },
            listFilesInDirectory: async function(baseDirName, dirHandle, ext) {
                var result = [];
                for await (const value of dirHandle.values()) {
                    if (value.kind == "directory") {
                        subDirHandle = await dirHandle.getDirectoryHandle(value.name);
                        result = result.concat(await utility.listFilesInDirectory(baseDirName + '/' + value.name, subDirHandle, ext));
                    }
                    else if (value.name.endsWith(ext)) {
                        result.push(baseDirName + '/' + value.name.replace("." + ext, ""));
                    }
                }
                return result;
            },
            updateResourcesList: async function() {
                for (const func of listResFunctions) {
                    await func().catch(e => console.warn(e.message));
                }
            },
            setWorkingDirectories: async function() {
                try {
                    dirResources = await editorRootDirectory.getDirectoryHandle("resources");
                    dirBinaryData = await editorRootDirectory.getDirectoryHandle("binary_editor").then(r => r.getDirectoryHandle("data"));
                } 
                catch (error) {
                    webix.alert("Can't recognise working directory structure");
                    return false;
                }

                texturesRoot = await dirBinaryData.getDirectoryHandle("textures");
                utility.updateResourcesList();
                return true;
            },
            setElementValue: function(name, value) {
                const e = document.getElementById(name);
                if (e.type == "checkbox") {
                    e.checked = value;
                }
                else {
                    e.value = e.defaultValue = value;
                }
            },
            elementValue: function(name) {
                const e = document.getElementById(name);
                return e.type == "checkbox" ? +e.checked : e.value;
            },
            showSection: function(id, show) {
                document.getElementById(id).hidden = !show;
            },
            addInspectSection: function(config) {
                const section = document.createElement("div");
                section.className = "editor_inspect_section";
                section.id = config.id;
                section.innerHTML = '<div class="editor_inspect_header" onclick="uiBindings.inspectToggle(this)">' + config.header + '</div><div class="editor_inspect_body editor_inspect_form">' + config.html + '</div>';
                document.getElementById("inspect").appendChild(section);
                section.classList.toggle("editor_inspect_collapsed", !!config.collapsed);
                section.hidden = true;
            },
            updateListPoint: function(listId, id, text, isNew) {
                const list = document.getElementById(listId);
                const oldId = isNew == "new" ? "" : list.value;
                if (oldId != id) {
                    if (oldId) {
                        list.selectedOptions[0].remove();
                    }
                    list.add(new Option(text, id));
                }
                else {
                    list.selectedOptions[0].text = text;
                }
                list.value = id;
            },
            removeListPoint: function(listId, removeMsg, selectMsg) {
                const list = document.getElementById(listId);
                const id = list.value;
                if (id) {
                    list.selectedOptions[0].remove();
                    uiEditor.sendMsg(removeMsg, id);
                    if (list.options.length) {
                        list.selectedIndex = 0;
                        uiEditor.sendMsg(selectMsg, list.value);
                    }
                }
            },
            nodeTreeItem: function(id) {
                return uiNodeTree.querySelector('[data-id="' + id + '"]');
            },
            selectedNodeId: function() {
                return uiNodeTree.querySelector(".editor_nodes_selected")?.parentNode.dataset.id;
            },
            unselectNode: function() {
                uiNodeTree.querySelector(".editor_nodes_selected")?.classList.remove("editor_nodes_selected");
            },
            selectNode: function(id) {
                utility.unselectNode();
                utility.nodeTreeItem(id).firstElementChild.classList.add("editor_nodes_selected");
                uiBindings.treeNodeSelected(id);
            },
            showNodeMenu: function(x, y) {
                const menu = document.getElementById("add_node_menu");
                menu.style.left = x + "px";
                menu.style.top = y + "px";
                menu.hidden = false;
            },
            addNodeMenuItem: function(id, value) {
                document.getElementById("add_node_menu").insertAdjacentHTML("beforeend", '<div class="editor_nodes_menu_item" onclick="uiBindings.createNode(\'' + id + '\')">' + value + '</div>');
            },
            insertItemToNodeTree: function(name) {
                var parent = uiNodeTree;
                var current = null;
                name.split('.').forEach(node => {
                    current = current ? current + "." + node : node;
                    let item = utility.nodeTreeItem(current);
                    if (item == null) {
                        item = document.createElement("div");
                        item.className = "editor_nodes_item";
                        item.dataset.id = current;
                        item.innerHTML = '<div class="editor_nodes_row"><span class="editor_nodes_toggle" onclick="uiBindings.treeNodeToggle(this)"></span><input type="checkbox"><span onclick="uiBindings.treeNodeClick(this)">' + node + '</span></div><div class="editor_nodes_children"></div>';
                        parent.appendChild(item);
                    }
                    item.classList.remove("editor_nodes_closed");
                    parent = item.lastElementChild;
                });
            },
            addItemToNodeTree: function(name, isPrefab) {
                utility.insertItemToNodeTree(name);
                if (isPrefab) {
                    utility.nodeTreeItem(name).classList.add("editor_nodes_prefab");
                }
                utility.selectNode(name);
            },
            hostUpdateResources: async function(handler) {
                try {
                    const response = await fetch("host_cmd_update");
                    if (!response.ok) {
                        throw new Error("Response status: ${response.status}");
                    }

                    handler();
                } 
                catch (error) {
                    console.error(error.message);
                }
            },
            pointsToString: function(points) {
                let result = "";
                for (const p of points) {
                    result += p.x.toFixed(4) + " " + p.value.toFixed(4) + " " + p.spread.toFixed(4) + " ";
                }
                return result;
            },
        }

        uiBindings = {
            setWorkingDirectory: async function() {
                editorRootDirectory = await window.showDirectoryPicker({ mode: "readwrite" });
                const db = await utility.openDB();
                await db.put('handles', editorRootDirectory, 'rootDirectory');

                let success = await utility.setWorkingDirectories();
                if (success) {
                    document.getElementById("nodes").style.visibility = "visible";
                    document.getElementById("top_buttons").hidden = false;
                    document.getElementById("swd").hidden = true;
                }
            },
            initWorkingDirectory: async function() {
                const db = await utility.openDB();
                editorRootDirectory = await db.get("handles", "rootDirectory");
                if (editorRootDirectory) {
                    const permission = await editorRootDirectory.queryPermission({ mode: "readwrite" });
                    if (permission === "granted") {
                        let success = await utility.setWorkingDirectories();
                        if (success) {
                            document.getElementById("nodes").style.visibility = "visible";
                            document.getElementById("top_buttons").hidden = false;
                            return;
                        }
                    }
                }
                document.getElementById("swd").hidden = false;
            },
            loadResources: async function(e) {
                $$("processing_popup").show();
                await utility.updateResourcesList();
                await utility.hostUpdateResources(() => {
                    $$("processing_popup").hide();
                });
            },
            centerOnObject: function(e) {
                uiEditor.sendMsg("editor.centerOnObject", "");
            },
            axisSwitch: function(e) {
                const img = e.firstElementChild;
                const nv = img.src.endsWith("axis_off.svg");
                img.src = nv ? "editor/axis.svg" : "editor/axis_off.svg";
                uiEditor.sendMsg("editor.axisSwitch", nv.toString());
            },
            updateSwitch: function(e) {
                const nv = e.textContent == "▶";
                e.textContent = nv ? "◼️" : "▶";
                uiEditor.sendMsg("editor.updateSwitch", nv.toString());
            },
            resourceSaveAndExit: function(e) {
                $$("processing_popup").show();
                uiEditor.sendMsg("editor.resource.save", "");
            },
            resourceDiscardAndExit: function(e) {
                uiEditor.sendMsg("editor.stopEditing", "");
                uiInspectMappingEdit[uiInspectType].forEach(item => {
                    utility.showSection(item, false);
                });
                document.getElementById("edit_resource_buttons").hidden = true;
                utility.showSection("node_1_resource_list", true);
            },
            treeNewNode: function(e) {
                const rect = e.getBoundingClientRect();
                utility.showNodeMenu(rect.right, rect.top);
            },
            treeNodeToggle: function(e) {
                e.closest(".editor_nodes_item").classList.toggle("editor_nodes_closed");
            },
            treeNodeClick: function(e) {
                utility.selectNode(e.closest(".editor_nodes_item").dataset.id);
            },
            createNode: function(id) {
                document.getElementById("add_node_menu").hidden = true;
                uiEditor.sendMsg("editor.createNode", id);
            },
            treeDeleteNode: function(e) {
                uiEditor.sendMsg("editor.deleteNode", utility.selectedNodeId());
            },
            treeNodeSelected: function(id) {
                document.getElementById("edit_resource_buttons").hidden = true;
                uiEditor.sendMsg("editor.stopEditing", "");
                uiEditor.sendMsg("editor.selectNode", id);
            },
            spaceClick: function(e) {
                document.getElementById("edit_resource_buttons").hidden = true;
                uiEditor.sendMsg("editor.stopEditing", "");
                utility.unselectNode();
                uiEditor.sendMsg("editor.clearNodeSelection", "");
                uiInspectMappingEdit[uiInspectType].forEach(item => {
                    utility.showSection(item, false);
                });
                uiInspectMappingBasic.forEach(item => {
                    utility.showSection(item, false);
                });
            },
            inspectToggle: function(e) {
                e.parentNode.classList.toggle("editor_inspect_collapsed");
            },
            nodeName: function(e) {
                if (/^(?!\.)[A-Za-z0-9_.]+(?<!\.)$/.test(e.value)) {
                    uiEditor.sendMsg("editor.renameNode", e.defaultValue + " " + e.value);
                }
                else {
                    e.value = e.defaultValue;
                }
            },
            nodeMove: function() {
                let args = utility.elementValue("inspect_node_x") + " " + utility.elementValue("inspect_node_y") + " " + utility.elementValue("inspect_node_z");
                uiEditor.sendMsg("editor.moveNode", args);
            },
            nodeStartEdit: function(e) {
                uiEditor.sendMsg("editor.startEditing", "");
            },
            prefabSave: function(e) {
                uiEditor.sendMsg("editor.savePrefab", "");
            },
            deleteResource: async function(e) {
                let path = uiResourceList.value;
                if (path.length) {
                    try {
                        let [dir, name] = await utility.getPathDirectoryAndName(dirResources, path);
                        const exts = resourcesExtMapping[uiInspectType];
                        for (const ext of exts) {
                            let file = await dir.getFileHandle(name + ext);
                            await file.remove();
                        }
                    } 
                    catch (error) {}
                }
                listResources[uiInspectType] = listResources[uiInspectType].filter(item => item !== path);
                uiResourceList.selectedOptions[0]?.remove();
                uiEditor.sendMsg("editor.setPath", "");
                uiEditor["engine.refresh"]();
            },
            cloneResource: async function(e) {
                let path = uiResourceList.value;
                if (path.length) {
                    webix.prompt({
                        title: "Clone with a new name", ok: "Clone", cancel: "Cancel", input: { value: path }
                    }).then(async (newPath) => {
                        $$("processing_popup").show();
                        try {
                            let [dstDir, dstName] = await utility.getPathDirectoryAndName(dirResources, newPath);
                            let [srcDir, srcName] = await utility.getPathDirectoryAndName(dirResources, path);
                            const exts = resourcesExtMapping[uiInspectType];
                            for (const ext of exts) {
                                try {
                                    let file = await dstDir.getFileHandle(dstName + ext);
                                    await file.remove();
                                } 
                                catch (error) {}

                                const srcFileHandle = await srcDir.getFileHandle(srcName + ext);
                                const srcFile = await srcFileHandle.getFile();
                                const dstFileHandle = await dstDir.getFileHandle(dstName + ext, { create: true });
                                const writable = await dstFileHandle.createWritable();
                                await writable.write(srcFile);
                                await writable.close();
                            }
                        } 
                        catch (error) {}
                        await utility.updateResourcesList();
                        await utility.hostUpdateResources(() => {
                            if (![...uiResourceList.options].some(o => o.value == newPath)) {
                                uiResourceList.add(new Option(newPath));
                            }
                            $$("processing_popup").hide();
                        });
                    });
                }
            }
        }
        
        webix.ui({
            view: "popup",
            id: "processing_popup",
            height: 50, width: 150,
            modal: true,
            position: "center",
            body: {
                padding:{
                    left: 20, right: 20
                },
                rows: [
                    { view: "label", label: "Processing..." }
                ]
            }
        });
        webix.message.position = "bottom";

        const uiNodeMenu = document.getElementById("add_node_menu");
        document.getElementById("nodes").addEventListener("contextmenu", (e) => {
            e.preventDefault();
            utility.showNodeMenu(e.clientX, e.clientY);
        });
        document.addEventListener("pointerdown", (e) => {
            if (!uiNodeMenu.contains(e.target)) uiNodeMenu.hidden = true;
        }, true);

        uiNodeTree = document.getElementById("node_tree");
        uiResourceList = document.getElementById("node_resource_list");

        function registerMeshResource() {
            listResFunctions.push(async function() {
                listResources["inspect_mesh"] = await dirResources.getDirectoryHandle("meshes").then(r => utility.listFilesInDirectory("meshes", r, "vox"));
                listResources["inspect_mesh"].sort();
            });

            uiInspectMappingEdit["inspect_mesh"] = ["voxel_mesh_edit_0", "voxel_mesh_edit_1"];
            resourcesExtMapping["inspect_mesh"] = [".vox", ".txt"];

            uiBindings.meshOffset = function() {
                let args = utility.elementValue("inspect_mesh_cx") + " " + utility.elementValue("inspect_mesh_cy") + " " + utility.elementValue("inspect_mesh_cz");
                uiEditor.sendMsg("editor.mesh.offset", args);
            };
            uiBindings.meshAddAnimation = function() {
                uiEditor.sendMsg("editor.mesh.animationAdd", "");
            };
            uiBindings.meshRemoveAnimation = function() {
                const list = document.getElementById("inspect_mesh_anim_list");
                const id = list.value;
                if (id) {
                    list.selectedOptions[0].remove();
                    utility.setElementValue("inspect_mesh_anim_name", "");
                    uiEditor.sendMsg("editor.mesh.animationRemoved", id);
                    if (list.options.length) {
                        list.selectedIndex = 0;
                        uiEditor.sendMsg("editor.mesh.animationSelected", list.value);
                    }
                }
            };
            uiBindings.meshAnimationParameters = function() {
                let args = utility.elementValue("inspect_mesh_anim_name") + " " + utility.elementValue("inspect_mesh_anim_first") + " ";
                args += utility.elementValue("inspect_mesh_anim_last") + " " + utility.elementValue("inspect_mesh_anim_time");
                uiEditor.sendMsg("editor.mesh.animationParameters", args);
            };
            uiBindings.meshAnimationPlay = function() {
                uiEditor.sendMsg("editor.mesh.animationPlay", "0");
            };
            uiBindings.meshAnimationLoop = function() {
                uiEditor.sendMsg("editor.mesh.animationPlay", "1");
            };

            utility.addNodeMenuItem("10", "Add Voxel Mesh");
            utility.addInspectSection({
                id: "voxel_mesh_edit_0", header: "Edit Mesh",
                html: `
                    <div class="editor_inspect_row">
                        <label>Center point:</label>
                        <input type="number" id="inspect_mesh_cx" step="0.5" min="-99" max="99" onchange="uiBindings.meshOffset()">
                        <input type="number" id="inspect_mesh_cy" step="0.5" min="-99" max="99" onchange="uiBindings.meshOffset()">
                        <input type="number" id="inspect_mesh_cz" step="0.5" min="-99" max="99" onchange="uiBindings.meshOffset()">
                    </div>`
            });
            utility.addInspectSection({
                id: "voxel_mesh_edit_1", header: "Animation",
                html: `
                    <div class="editor_inspect_row">
                        <label>Name:</label>
                        <input type="text" id="inspect_mesh_anim_name" onchange="uiBindings.meshAnimationParameters()">
                    </div>
                    <div class="editor_inspect_row">
                        <label>First:</label>
                        <input type="number" id="inspect_mesh_anim_first" style="width: 44px" step="1" min="0" max="99" onchange="uiBindings.meshAnimationParameters()">
                        <label>Last:</label>
                        <input type="number" id="inspect_mesh_anim_last" style="width: 44px" step="1" min="0" max="99" onchange="uiBindings.meshAnimationParameters()">
                        <label>Ms:</label>
                        <input type="number" id="inspect_mesh_anim_time" style="width: 66px" step="10" min="100" max="9000" value="100" onchange="uiBindings.meshAnimationParameters()">

                            <input type="number" id="inspect_collision_shape_p1" step="0.1" min="-999" max="999" onchange="uiBindings.collisionPointArgs()">
                            <input type="number" id="inspect_collision_shape_p2" step="0.1" min="-999" max="999" onchange="uiBindings.collisionPointArgs()">
                        </div>
                        <div class="editor_inspect_row">
                            <select id="inspect_collision_shape_pointlist" size="10" style="height: 200px" onchange="uiEditor.sendMsg('editor.collision.pointSelected', this.value)"></select>
                            <div class="editor_nodes_buttons">
                                <button class="editor_top_button" title="Add point" onclick="uiBindings.collisionAddPoint()">&#x2795;</button>
                                <button class="editor_top_button" title="Delete point" onclick="uiBindings.collisionRemovePoint()">&#x274C;</button>
                            </div>
                        </div>
                    </div>`
            });

            uiEditor["engine.collision.editing"] = function(data) {
                const [type, panel] = data.split(' ');
                document.getElementById("inspect_collision_shape_pointlist").replaceChildren();
                utility.showSection("node_1_resource_list", false);
                document.getElementById("edit_resource_buttons").hidden = false;
                uiInspectMappingEdit["inspect_collision"].forEach(item => {
                    utility.showSection(item, true);
                });
                showCollisionPanel(panel);
                utility.setElementValue("inspect_collision_shape_type", type);
            }
            uiEditor["engine.collision.circleXZ"] = function(data) {
                const [mass, radius, height] = data.split(' ');
                utility.setElementValue("inspect_collision_shape_mass", mass);
                utility.setElementValue("inspect_collision_shape_radius", radius);
                utility.setElementValue("inspect_collision_shape_height", height);
            }
            uiEditor["engine.collision.obstaclePoint"] = function(data) {
                const [id, p1, p2, isNew] = data.split(' ');
                utility.updateListPoint("inspect_collision_shape_pointlist", id, p1 + " " + p2, isNew);

                utility.setElementValue("inspect_collision_shape_p1", p1);
                utility.setElementValue("inspect_collision_shape_p2", p2);
            }
        }
        function registerPrefabResource() {
            listResFunctions.push(async function() {
                listResources["inspect_prefab"] = await dirResources.getDirectoryHandle("prefabs").then(r => utility.listFilesInDirectory("prefabs", r, "txt"));
                listResources["inspect_prefab"].sort();
            });

            uiInspectMappingEdit["inspect_prefab"] = [];
            resourcesExtMapping["inspect_prefab"] = [".txt"];

            utility.addNodeMenuItem("0", "Add Prefab");
            
            uiEditor["engine.prefab.editFail"] = function(data) {
                alert("Attempt to edit a prefab with the root node '" + data + "'. But the tree already has a node with that name");
            }
            uiEditor["engine.prefab.editing"] = function(data) {
                uiEditor.sendMsg("editor.stopEditing", "");
            }
            uiEditor["engine.savePrefab"] = async function(data) {
                try {
                    let prefabDir = await dirResources.getDirectoryHandle("prefabs");
                    const fileHandle = await window.showSaveFilePicker({
                        suggestedName: "prefab",
                        startIn: prefabDir,
                        types: [
                            {
                                description: "Prefab Descriptions",
                                accept: { "text/plain": [".txt"] },
                            },
                        ],
                    });

                    $$("processing_popup").show();

                    const writable = await fileHandle.createWritable();
                    await writable.write(data);
                    await writable.close();

                    console.log("[JS] Prefab saved as", fileHandle.name);

                    await utility.updateResourcesList();
                    await utility.hostUpdateResources(() => {
                        uiEditor.sendMsg("editor.reloadPrefabs", "");
                    });
                }
                catch (err) {
                    if (err.name != "AbortError") {
                        console.error("[JS] Error saving prefab:", err);
                    }
                }
            }
        }

        if (typeof uiEditor != 'undefined') {
            uiEditor["engine.nodeCreated"] = function(data) {
                console.log("[JS] engine.nodeCreated", data);
                const [name, isPrefabStr] = data.split(' ');
                const isPrefab = parseInt(isPrefabStr);
                utility.addItemToNodeTree(name, isPrefab);
                utility.setElementValue("inspect_node_name", name);
            }
            uiEditor["engine.nodeDeleted"] = function(data) {
                console.log("[JS] engine.nodeDeleted", data);
                utility.nodeTreeItem(utility.selectedNodeId()).remove();
                uiBindings.spaceClick(null);
            }
            uiEditor["engine.nodeSelected"] = function(data) {
                console.log("[JS] engine.nodeSelected", data);
                const [name, panel, arg0] = data.split(' ');

                uiInspectMappingEdit[uiInspectType].forEach(item => {
                    utility.showSection(item, false);
                });
                uiInspectMappingBasic.forEach(item => {
                    utility.showSection(item, true);
                });

                uiResourceList.replaceChildren(...listResources[panel].map(p => new Option(p)));
                uiResourceList.value = arg0;

                uiInspectType = panel;
                utility.setElementValue("inspect_node_name", name);
            }
            uiEditor["engine.nodeRenamed"] = function(data) {
                console.log(data);
                var [success, old, nv] = data.split(' ');
                if (success == "ok") {
                    const item = utility.nodeTreeItem(old);
                    const isPrefab = item.classList.contains("editor_nodes_prefab");
                    item.remove();
                    utility.addItemToNodeTree(nv, isPrefab);
                }
                else {
                    utility.setElementValue("inspect_node_name", old);
                }
            }
            uiEditor["engine.nodeCoordinates"] = function(data) {
                const [x, y, z] = data.split(' ');
                Object.entries({inspect_node_x: x, inspect_node_y: y, inspect_node_z: z}).forEach(([k, v]) => {
                    utility.setElementValue(k, v);
                });
            }
            uiEditor["engine.insertNode"] = function(data) {
                console.log("[JS] engine.insertNode", data);
                utility.insertItemToNodeTree(data);
            }
            uiEditor["engine.saved"] = async function(data) {
                console.log("[JS] engine.saved", data);
                utility.hostUpdateResources(() => {
                    uiEditor.sendMsg("editor.reloadResources", data);
                });
                uiInspectMappingEdit[uiInspectType].forEach(item => {
                    utility.showSection(item, false);
                });
                uiInspectMappingBasic.forEach(item => {
                    utility.showSection(item, true);
                });

                document.getElementById("edit_resource_buttons").hidden = true;
            }
            uiEditor["engine.resourcesReloaded"] = function(data) {
                $$("processing_popup").hide();
            }
            uiEditor["engine.failmsg"] = function(data) {
                console.log(data);
                webix.message({ text: data, expire: 3000});
            }

            registerPrefabResource();
            registerMeshResource();
            registerGroundResource();
            registerParticlesResource();
            registerRaycastShapeResource();
            registerCollisionShapeResource();
        }

        uiBindings.initWorkingDirectory();

    </script>
</body>
</html>
